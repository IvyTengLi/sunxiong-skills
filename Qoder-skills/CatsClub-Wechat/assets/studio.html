<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>狲熊排版器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Noto Sans SC','PingFang SC',sans-serif;background:#0b0b0b;color:#e0e0e0;height:100vh;overflow:hidden;display:flex}
#left{width:440px;min-width:400px;display:flex;flex-direction:column;border-right:1px solid #1e1e1e;background:#111;overflow-y:auto;height:100vh}
#right{flex:1;display:flex;flex-direction:column;align-items:center;overflow:hidden;background:#080808}
.hdr{padding:14px 18px;border-bottom:1px solid #1e1e1e;flex-shrink:0;display:flex;align-items:center;gap:10px}
.logo{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:900}
.sec{padding:10px 18px;border-bottom:1px solid #1e1e1e;flex-shrink:0}
.sec-label{font-size:9px;color:#555;margin-bottom:6px;font-weight:700;letter-spacing:2px;display:flex;justify-content:space-between;align-items:center}
.sec-label .hint{color:#333;font-weight:400;letter-spacing:0;font-size:9px}

/* 风格按钮 */
.grp{margin-bottom:6px}
.grp:last-child{margin-bottom:0}
.grp-title{font-size:9px;color:#3a3a3a;margin-bottom:4px;font-weight:700;letter-spacing:1.5px}
.grp-row{display:flex;flex-wrap:wrap;gap:4px}
.sbtn{background:transparent;border:1px solid #1e1e1e;border-radius:14px;padding:4px 10px;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .15s}
.sbtn.act{background:#222}
.sbtn .dot{width:6px;height:6px;border-radius:50%}
.sbtn span{font-size:11px;color:#666;font-weight:400}
.sbtn.act span{color:#fff;font-weight:600}

/* 品牌色 */
.color-row{display:flex;align-items:center;gap:6px}
.color-row label{font-size:9px;color:#555;font-weight:700;letter-spacing:1px;flex-shrink:0}
.color-row input[type=color]{width:24px;height:24px;border:none;border-radius:4px;cursor:pointer;background:transparent;padding:0}
.color-row input[type=text]{flex:1;background:#1a1a1a;border:1px solid #222;border-radius:5px;padding:4px 8px;color:#888;font-size:11px;outline:none;font-family:monospace}
.color-row button{background:#1e1e1e;border:none;border-radius:4px;padding:3px 7px;color:#666;font-size:9px;cursor:pointer}

/* 图片台 */
#img-bay{max-height:200px;overflow-y:auto}
#img-bay::-webkit-scrollbar{width:4px}
#img-bay::-webkit-scrollbar-thumb{background:#222;border-radius:2px}
.img-add{width:100%;background:#161616;border:1px dashed #2a2a2a;border-radius:6px;padding:10px;cursor:pointer;color:#555;font-size:11px;text-align:center;transition:all .15s}
.img-add:hover{border-color:#3a3a3a;color:#777;background:#1a1a1a}
.img-add.dragover{border-color:#4a90e2;color:#4a90e2;background:#1a2230}
.img-list{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.img-item{display:flex;align-items:center;gap:8px;background:#161616;border:1px solid #1e1e1e;border-radius:6px;padding:6px 8px;font-size:11px}
.img-thumb{width:32px;height:32px;border-radius:4px;object-fit:cover;flex-shrink:0;background:#222}
.img-meta{flex:1;min-width:0}
.img-num{color:#888;font-weight:700;font-family:monospace}
.img-name{color:#666;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.img-role{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:3px;color:#888;font-size:10px;padding:2px 5px;outline:none;cursor:pointer}
.img-cap{width:100%;background:#0e0e0e;border:1px solid #1e1e1e;border-radius:3px;color:#777;font-size:10px;padding:3px 6px;outline:none;margin-top:3px;font-family:inherit}
.img-del{background:transparent;border:none;color:#444;cursor:pointer;font-size:14px;padding:2px 4px}
.img-del:hover{color:#888}

/* 插入按钮 */
.insert-row{display:flex;flex-wrap:wrap;gap:4px}
.ins-btn{background:#161616;border:1px solid #1e1e1e;border-radius:12px;padding:4px 10px;cursor:pointer;color:#777;font-size:10px;transition:all .15s}
.ins-btn:hover{background:#1e1e1e;color:#aaa;border-color:#2a2a2a}
.ins-btn.ins-img{color:#5a8fa0;border-color:#1f2a30}
.ins-btn.ins-img:hover{color:#7eb6c8;border-color:#2a3a45;background:#16222a}
.img-insert{background:#1a3a45;border:1px solid #2a4a5a;border-radius:4px;color:#7eb6c8;font-size:10px;padding:3px 8px;cursor:pointer;margin-right:4px;font-weight:600}
.img-insert:hover{background:#234a5a;color:#9bc8da}

/* 编辑器 */
#editor-wrap{flex:1;display:flex;flex-direction:column;padding:8px 18px;min-height:240px}
.ed-label{font-size:9px;color:#555;margin-bottom:5px;font-weight:700;letter-spacing:1px;display:flex;justify-content:space-between}
#editor{flex:1;background:#0a0a0a;border:1px solid #1a1a1a;border-radius:8px;padding:12px;color:#aaa;font-size:12px;line-height:1.75;resize:vertical;outline:none;font-family:'SF Mono','Fira Code',monospace;min-height:180px}

/* 复制 */
#copy-wrap{padding:8px 18px 12px;border-top:1px solid #1e1e1e;flex-shrink:0}
#copy-btn{width:100%;padding:11px;border:none;border-radius:10px;color:#fff;font-size:13px;font-weight:700;cursor:pointer;transition:all .3s;letter-spacing:1px}
#copy-hint{font-size:9px;color:#333;text-align:center;margin:5px 0 0;line-height:1.5}

/* 右侧预览 */
.prev-bar{width:100%;padding:8px 18px;border-bottom:1px solid #131313;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.prev-bar .pl{font-size:10px;color:#2a2a2a;letter-spacing:1px}
.style-tag{font-size:10px;color:#444;background:#131313;padding:3px 10px;border-radius:8px}
.style-tag .tdot{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:5px;vertical-align:middle}
#phone-wrap{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:16px;overflow:auto;width:100%}
#phone{width:375px;background:#1a1a1a;border-radius:40px;padding:12px;box-shadow:0 4px 80px rgba(0,0,0,.6);flex-shrink:0}
.phone-top{border-radius:30px 30px 0 0;overflow:hidden}
.notch{display:flex;justify-content:center;padding:8px 0 6px}
.notch-bar{width:72px;height:22px;background:#1a1a1a;border-radius:11px}
.wx-bar{padding:6px 0;text-align:center;font-size:13px;font-weight:600;letter-spacing:.5px}
#article{padding:16px 18px 36px;min-height:480px;overflow-y:auto;max-height:calc(100vh - 200px)}
#article::-webkit-scrollbar{width:4px}
#article::-webkit-scrollbar-thumb{background:#0003;border-radius:2px}
.phone-bot{border-radius:0 0 30px 30px;padding:12px 0;text-align:center}
.home-bar{width:100px;height:4px;opacity:.1;border-radius:2px;margin:0 auto}

/* 折叠区域 */
.collapsible{cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.collapsible::after{content:"▾";color:#444;font-size:8px;transition:transform .2s;display:inline-block}
.collapsible.collapsed::after{transform:rotate(-90deg)}
</style>
</head>

// 内容分析层 — 在 Markdown 解析之前对文章进行结构化分析

  {id:"paw-hr",name:"🐾 爪印分隔线",pattern:/^[\s]*·[\s]*·[\s]*·[\s]*$/m,desc:"段落间轻分隔",category:"分隔符"},
  {id:"shadow",name:"长影分隔块",pattern:/^={3,}$/m,desc:"大章节切换",category:"分隔符"},
  {id:"ring",name:"缺口圆环标",pattern:/^\[ring\].+?\[\/ring\]$/m,desc:"引用块左侧装饰",category:"分隔符"},
  {id:"dots",name:"米罗星点散落",pattern:/^\.{3,}$/m,desc:"playful 过渡",category:"分隔符"},
  {id:"bq",name:"基里科引用块",pattern:/^>[\s]*.+$/m,desc:"金句、学员反馈",category:"引用与强调"},
  {id:"quest",name:"任务卡框",pattern:/^\[quest\].+?\[\/quest\]$/m,desc:"实操步骤、Quest 标记",category:"引用与强调"},
  {id:"elite",name:"帝国紫印章",pattern:/^\[elite\].+?\[\/elite\]$/m,desc:"earned 内容（结业/限量/精英）",category:"引用与强调"},
  {id:"code",name:"猫熊代码块",pattern:/^```[\s\S]*?^```$/m,desc:"代码片段、Prompt 示例",category:"引用与强调"},
  {id:"ol",name:"通关数字标",pattern:/^\s*\d+\.[\s]+.+$/m,desc:"步骤列表、课程模块",category:"列表与序列"},
  {id:"ul",name:"米罗圆点列",pattern:/^\s*[-*+][\s]+.+$/m,desc:"轻松 bullet list",category:"列表与序列"},
  {id:"arrows",name:"箭头序列",pattern:/^\[->\].+$/m,desc:"流程说明、逻辑递进",category:"列表与序列"},
  {id:"eyebrow",name:"eyebrow 标签",pattern:/^@\[.+?\]\s*.+$/m,desc:"文章分类标签",category:"标题装饰"},
  {id:"underline",name:"锈橙下划线",pattern:/^##\[.+?\]$/m,desc:"章节标题强调",category:"标题装饰"},

// 内容特征检测规则（用于智能建议）
const CONTENT_PATTERNS={
  // 对话特征
  dialog:/^(🐱|🐼|🤖|👤)\s*.+?[:：]\s*.+$/m,
  // 内心 OS
  innerOS:/\(\(\S+\s+.+?\)\)/g,
  // 包袱标记
  gag:/\{\{\S+\s+.+?\}\}/g,
  // 金句（pull quote）
  pullQuote:/^‖\s*.+?\s*‖$/m,
  // 导语
  lead:/^>>>\s*.+$/m,
  // 提示框
  callout:/^!!!\s*(tip|note|warn|info)/m,
  // 血条
  hp:/^\[hp:\d+\/\d+\]$/m,
  // Buff/Debuff
  buff:/^\[buff\].*?\[\/buff\]$/m,
  debuff:/^\[debuff\].*?\[\/debuff\]$/m,
  // 强调标记
  strong:/\*\*.+?\*\*/g,
  highlight:/==.+?==/g,
  // 图片占位
  imgPlaceholder:/!?\[\[[0-9,\s]+(?:\|\w+)?\]\]/g,
  // 标准 Markdown 图片
  stdImg:/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g,
};

function analyzeContent(text){
  const lines=text.split("\n");
  const report={
    // 基础统计
    stats:{totalChars:text.replace(/\s/g,"").length,totalLines:lines.length,totalWords:text.split(/\s+/).filter(w=>w.length>0).length},
    // 章节结构
    sections:[],
    // 检测到的元素
    elements:[],
    // 内容特征
    features:{},
    // 智能建议
    suggestions:[],
    // 图片分析
    images:{placeholders:0,stdImages:0,total:0},
  };

  // ── 1. 章节结构识别 ──
  let currentSection=null;
  let sectionIndex=0;
  lines.forEach(function(line,idx){
    const trimmed=line.trim();
    // H1 标题 → 新文章/封面区域
    if(/^#[\s]+.+/.test(trimmed)){
      if(currentSection){currentSection.endLine=idx-1;}
      currentSection={level:1,title:trimmed.replace(/^#[\s]+/,""),startLine:idx,endLine:-1,index:sectionIndex++};
      report.sections.push(currentSection);
      return;
    }
    // H2 标题 → 主要章节
    if(/^##[\s]+.+/.test(trimmed)){
      if(currentSection){currentSection.endLine=idx-1;}
      currentSection={level:2,title:trimmed.replace(/^##[\s]+/,""),startLine:idx,endLine:-1,index:sectionIndex++};
      report.sections.push(currentSection);
      return;
    }
    // H3 标题 → 小节
    if(/^###[\s]+.+/.test(trimmed)){
      if(currentSection){currentSection.endLine=idx-1;}
      currentSection={level:3,title:trimmed.replace(/^###[\s]+/,""),startLine:idx,endLine:-1,index:sectionIndex++};
      report.sections.push(currentSection);
      return;
    }
    // 长影分隔块 === 也视为章节边界
    if(/^={3,}$/.test(trimmed)){
      if(currentSection){currentSection.endLine=idx-1;}
      currentSection={level:0,title:"SECTION BREAK",startLine:idx,endLine:idx,index:sectionIndex++,isBreak:true};
      report.sections.push(currentSection);
      currentSection=null;
      return;
    }
  });
  // 关闭最后一个章节
  if(currentSection&&currentSection.endLine===-1){currentSection.endLine=lines.length-1;}

  // ── 2. 15 个排版组件检测 ──
  ELEMENT_DETECTORS.forEach(function(det){
    const matches=text.match(det.pattern);
    const count=matches?matches.length:0;
    if(count>0){
      report.elements.push({id:det.id,name:det.name,category:det.category,desc:det.desc,count:count});
    }
  });

  // ── 3. 内容特征分析 ──
  // 对话
  const dialogMatches=text.match(CONTENT_PATTERNS.dialog);
  report.features.hasDialog=!!dialogMatches;
  report.features.dialogCount=dialogMatches?dialogMatches.length:0;

  // 内心 OS
  const osMatches=text.match(CONTENT_PATTERNS.innerOS);
  report.features.hasInnerOS=!!osMatches;
  report.features.innerOSCount=osMatches?osMatches.length:0;

  // 包袱
  const gagMatches=text.match(CONTENT_PATTERNS.gag);
  report.features.hasGag=!!gagMatches;
  report.features.gagCount=gagMatches?gagMatches.length:0;

  // 金句
  const pullMatches=text.match(CONTENT_PATTERNS.pullQuote);
  report.features.hasPullQuote=!!pullMatches;
  report.features.pullQuoteCount=pullMatches?pullMatches.length:0;

  // 导语
  const leadMatches=text.match(CONTENT_PATTERNS.lead);
  report.features.hasLead=!!leadMatches;

  // 提示框
  const calloutMatches=text.match(CONTENT_PATTERNS.callout);
  report.features.hasCallout=!!calloutMatches;
  report.features.calloutCount=calloutMatches?calloutMatches.length:0;

  // 血条
  report.features.hasHP=CONTENT_PATTERNS.hp.test(text);

  // Buff/Debuff
  report.features.hasBuff=CONTENT_PATTERNS.buff.test(text);
  report.features.hasDebuff=CONTENT_PATTERNS.debuff.test(text);

  // 强调
  const strongMatches=text.match(CONTENT_PATTERNS.strong);
  report.features.strongCount=strongMatches?strongMatches.length:0;
  const highlightMatches=text.match(CONTENT_PATTERNS.highlight);
  report.features.highlightCount=highlightMatches?highlightMatches.length:0;

  // 图片统计
  const imgPlaceMatches=text.match(CONTENT_PATTERNS.imgPlaceholder);
  report.images.placeholders=imgPlaceMatches?imgPlaceMatches.length:0;
  const stdImgMatches=text.match(CONTENT_PATTERNS.stdImg);
  report.images.stdImages=stdImgMatches?stdImgMatches.length:0;
  report.images.total=report.images.placeholders+report.images.stdImages;

  // ── 4. 智能建议生成 ──
  // 建议1：缺少导语
  if(!report.features.hasLead&&report.stats.totalChars>300){
    report.suggestions.push({type:"element",priority:"medium",msg:"文章较长但缺少导语，建议在开头添加 >>> 导语段落",element:"lead"});
  }
  // 建议2：章节过多但缺少分隔符
  const sectionCount=report.sections.filter(s=>s.level===2).length;
  const separatorCount=(report.elements.find(e=>e.id==="shadow")?.count||0)+(report.elements.find(e=>e.id==="paw-hr")?.count||0);
  if(sectionCount>=3&&separatorCount<sectionCount/2){
    report.suggestions.push({type:"element",priority:"low",msg:"章节较多，建议在大章节切换处添加 === 长影分隔块",element:"shadow"});
  }
  // 建议3：有对话但缺少角色标记
  if(report.features.hasDialog&&!(report.elements.find(e=>e.id==="ring"))){
    report.suggestions.push({type:"element",priority:"low",msg:"检测到角色对话，可在关键对话前添加 [ring]重点提示[/ring] 增强视觉",element:"ring"});
  }
  // 建议4：有步骤说明但缺少箭头序列
  if((report.elements.find(e=>e.id==="ol")?.count||0)>=2&&!(report.elements.find(e=>e.id==="arrows"))){
    report.suggestions.push({type:"element",priority:"low",msg:"检测到多个步骤列表，可在流程总结处使用 [->]箭头序列",element:"arrows"});
  }
  // 建议5：earned 内容检测（关键词）
  const earnedKeywords=/结业|认证|限量|精英|完成|通关|毕业|成就/i;
  if(earnedKeywords.test(text)&&!(report.elements.find(e=>e.id==="elite"))){
    report.suggestions.push({type:"element",priority:"medium",msg:"检测到 earned 相关词汇，建议添加 [elite]帝国紫印章[/elite] 标记",element:"elite"});
  }
  // 建议6：长段落检测
  let longParaCount=0;
  let currentParaLen=0;
  lines.forEach(function(line){
    if(line.trim()===""){if(currentParaLen>200)longParaCount++;currentParaLen=0;}
    else{currentParaLen+=line.length;}
  });
  if(longParaCount>=2){
    report.suggestions.push({type:"structure",priority:"low",msg:"检测到 "+longParaCount+" 处超长段落（>200字），建议拆分段落或插入配图"});
  }
  // 建议7：缺少 eyebrow 标签
  if(sectionCount>=2&&!(report.elements.find(e=>e.id==="eyebrow"))){
    report.suggestions.push({type:"element",priority:"low",msg:"多章节文章建议添加 @[分类标签] eyebrow 标签增强导航感",element:"eyebrow"});
  }
  // 建议8：图片配比
  const minImg=Math.max(1,Math.floor(sectionCount*0.5));
  if(report.images.total<minImg){
    report.suggestions.push({type:"structure",priority:"medium",msg:"图片偏少（"+report.images.total+" 张），建议每个主要章节至少配 1 张图"});
  }

  return report;
}

// ═══════════════════════════════════════════════
// Markdown 解析器 — 扩展支持新元素
// ═══════════════════════════════════════════════
function parseMD(text){
  const lines=text.split("\n");
  const tokens=[];
  let i=0;
  while(i<lines.length){
    const l=lines[i];
    if(!l.trim()){i++;continue;}

    // 代码块
    if(l.trim().startsWith("```")){
      const lang=l.trim().slice(3).trim();
      const c=[];i++;
      while(i<lines.length&&!lines[i].trim().startsWith("```")){c.push(lines[i]);i++;}
      tokens.push({t:"code",c:c.join("\n"),lang});i++;continue;
    }

    // 提示框 !!! type 标题
    const callMatch=l.match(/^!!!\s+(tip|note|warn|info)(?:\s+(.+))?/);
    if(callMatch){
      const type=callMatch[1];
      const title=callMatch[2]||"";
      const c=[];i++;
      while(i<lines.length&&!lines[i].trim().startsWith("!!!")){c.push(lines[i]);i++;}
      tokens.push({t:"callout",ctype:type,title,c:c.join("\n").trim()});
      if(i<lines.length)i++;
      continue;
    }

    // 落款 --- 开头但内容里有 "作者" 或 "公众号"
    if(/^---\s*作者[:：]/.test(l)||/^---\s*signature/i.test(l)){
      tokens.push({t:"sign",c:l.replace(/^---\s*/,"").trim()});
      i++;continue;
    }

    // 普通分隔线
    if(/^(-{3,}|\*{3,}|_{3,})$/.test(l.trim())){tokens.push({t:"hr"});i++;continue;}

    // 长影分隔块 ===
    if(/^={3,}$/.test(l.trim())){tokens.push({t:"shadow"});i++;continue;}

    // 缺口圆环标 [ring]内容[/ring]
    const ringMatch=l.match(/^\[ring\](.+?)\[\/ring\]$/);
    if(ringMatch){tokens.push({t:"ring",c:ringMatch[1]});i++;continue;}

    // 米罗星点散落 ...
    if(/^\.{3,}$/.test(l.trim())){tokens.push({t:"dots"});i++;continue;}

    // 帝国紫印章 [elite]内容[/elite]
    const eliteMatch=l.match(/^\[elite\](.+?)\[\/elite\]$/);
    if(eliteMatch){tokens.push({t:"elite",c:eliteMatch[1]});i++;continue;}

    // 箭头序列 [->]内容[->]内容[->]内容
    const arrowMatch=l.match(/^\[->\](.+)$/);
    if(arrowMatch){
      const items=arrowMatch[1].split(/\[->\]/).map(s=>s.trim()).filter(Boolean);
      if(items.length>1){tokens.push({t:"arrows",items});i++;continue;}
    }

    // eyebrow 标签 @[分类标签]
    const eyebrowMatch=l.match(/^@\[(.+?)\]\s*(.+)$/);
    if(eyebrowMatch){tokens.push({t:"eyebrow",label:eyebrowMatch[1],title:eyebrowMatch[2]});i++;continue;}

    // 锈橙下划线 ##[内容]
    const underlineMatch=l.match(/^##\[(.+?)\]$/);
    if(underlineMatch){tokens.push({t:"underline",c:underlineMatch[1]});i++;continue;}

    // 金箔首字下沉 ![首字]内容
    const dropcapMatch=l.match(/^!\[(\w)\]\s*(.+)$/);
    if(dropcapMatch){tokens.push({t:"dropcap",letter:dropcapMatch[1],c:dropcapMatch[2]});i++;continue;}

    // 双角色签名 [sign2]
    if(/^\[sign2\]$/.test(l.trim())){tokens.push({t:"sign2"});i++;continue;}

    // 导语 >>> 内容
    if(l.trim().startsWith(">>> ")){
      const q=[];
      while(i<lines.length&&lines[i].trim().startsWith(">>> ")){
        q.push(lines[i].trim().slice(4));i++;
      }
      tokens.push({t:"lead",c:q.join(" ")});continue;
    }

    // 标题
    const h=l.match(/^(#{1,3})\s+(.+)/);
    if(h){tokens.push({t:"h"+h[1].length,c:h[2].trim()});i++;continue;}

    // 引用
    if(l.trim().startsWith("> ")){
      const q=[];
      while(i<lines.length&&lines[i].trim().startsWith("> ")){q.push(lines[i].trim().slice(2));i++;}
      tokens.push({t:"bq",c:q.join("\n")});continue;
    }

    // 金句 ‖ 内容 ‖
    const pullMatch=l.match(/^‖\s*(.+?)\s*‖$/);
    if(pullMatch){tokens.push({t:"pull",c:pullMatch[1]});i++;continue;}

    // 角色对话 🐱 兔狲：内容
    const dialogMatch=l.match(/^(🐱|🐼|🤖|👤)\s*(.+?)[:：]\s*(.+)$/);
    if(dialogMatch){tokens.push({t:"dialog",role:dialogMatch[1],name:dialogMatch[2],c:dialogMatch[3]});i++;continue;}

    // 任务卡片 [quest]内容[/quest]
    const questMatch=l.match(/^\[quest\](.+?)\[\/quest\]$/);
    if(questMatch){tokens.push({t:"quest",c:questMatch[1]});i++;continue;}

    // 血条 [hp:75/100]
    const hpMatch=l.match(/^\[hp:(\d+)\/(\d+)\]$/);
    if(hpMatch){tokens.push({t:"hp",current:parseInt(hpMatch[1]),max:parseInt(hpMatch[2])});i++;continue;}

    // Buff [buff]内容[/buff]
    const buffMatch=l.match(/^\[buff\](.+?)\[\/buff\]$/);
    if(buffMatch){tokens.push({t:"buff",c:buffMatch[1]});i++;continue;}

    // Debuff [debuff]内容[/debuff]
    const debuffMatch=l.match(/^\[debuff\](.+?)\[\/debuff\]$/);
    if(debuffMatch){tokens.push({t:"debuff",c:debuffMatch[1]});i++;continue;}

    // 表格
    if(l.includes("|")&&i+1<lines.length&&/^[\s|:-]+$/.test(lines[i+1])){
      const headers=l.split("|").map(s=>s.trim()).filter(Boolean);
      i+=2;
      const rows=[];
      while(i<lines.length&&lines[i].includes("|")){
        rows.push(lines[i].split("|").map(s=>s.trim()).filter(Boolean));
        i++;
      }
      tokens.push({t:"table",headers,rows});continue;
    }

    // 图片占位 ![[1]] 或 ![[1|cover]] 或 ![[1,2|duo]]
    const imgPlace=l.trim().match(/^!\[\[([0-9,\s]+)(?:\|(\w+))?\]\]$/);
    if(imgPlace){
      const ids=imgPlace[1].split(",").map(s=>parseInt(s.trim())).filter(n=>!isNaN(n));
      let role=imgPlace[2]||"fig";
      if(!imgPlace[2]){
        if(ids.length===2)role="duo";
        else if(ids.length===3)role="trio";
      }
      tokens.push({t:"img",ids,role});i++;continue;
    }

    // 标准 Markdown 图片 ![alt](url "caption")
    const stdImg=l.trim().match(/^!\[([^\]]*)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)$/);
    if(stdImg){
      tokens.push({t:"imgUrl",alt:stdImg[1],url:stdImg[2],cap:stdImg[3]||""});i++;continue;
    }

    // 列表
    if(/^\s*[-*+]\s+/.test(l)){
      const a=[];
      while(i<lines.length&&/^\s*[-*+]\s+/.test(lines[i])){a.push(lines[i].replace(/^\s*[-*+]\s+/,""));i++;}
      tokens.push({t:"ul",items:a});continue;
    }
    if(/^\s*\d+\.\s+/.test(l)){
      const a=[];
      while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i])){a.push(lines[i].replace(/^\s*\d+\.\s+/,""));i++;}
      tokens.push({t:"ol",items:a});continue;
    }

    // 段落
    const p=[];
    while(i<lines.length&&lines[i].trim()!==""&&
          !lines[i].trim().startsWith("#")&&
          !lines[i].trim().startsWith("> ")&&
          !lines[i].trim().startsWith(">>>")&&
          !lines[i].trim().startsWith("```")&&
          !lines[i].trim().startsWith("!!!")&&
          !lines[i].trim().startsWith("---")&&
          !/^(-{3,}|\*{3,}|_{3,})$/.test(lines[i].trim())&&
          !/^\s*[-*+]\s+/.test(lines[i])&&
          !/^\s*\d+\.\s+/.test(lines[i])&&
          !/^!\[/.test(lines[i].trim())&&
          !/^‖/.test(lines[i].trim())){
      p.push(lines[i]);i++;
    }
    if(p.length)tokens.push({t:"p",c:p.join(" ")});
  }
  return tokens;
}

function inl(t,s){
  let h=t;
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong style="color:'+s.ac+';font-weight:700">$1</strong>');
  h=h.replace(/(?<!\*)\*([^*]+?)\*(?!\*)/g,'<em style="font-style:italic">$1</em>');
  h=h.replace(/==(.+?)==/g,function(_,m){return '<span style="border-bottom:2px solid '+s.ac+';font-weight:600;color:'+s.hd+';padding-bottom:1px">'+m+'</span>';});
  h=h.replace(/`(.+?)`/g,'<code style="background:'+s.al+';color:'+s.ac+';padding:2px 6px;border-radius:3px;font-size:13px">$1</code>');
  h=h.replace(/\[(.+?)\]\((.+?)\)/g,'<a style="color:'+s.ac+';text-decoration:none;border-bottom:1px solid '+s.ac+'">$1</a>');
  // 内心OS ((emoji 内容))
  h=h.replace(/\(\((\S+)\s+(.+?)\)\)/g,function(_,emoji,content){
    const color=emoji==='🐦'?s.ac:(emoji==='🦉'?'#1E3A5F':'#7A7A7A');
    return '<span style="display:inline-block;border-left:2px dashed '+color+';padding-left:8px;margin:0 4px;color:'+color+';font-style:italic;font-size:14px">'+emoji+' '+content+'</span>';
  });
  // 包袱标记 {{emoji 内容}}
  h=h.replace(/\{\{(\S+)\s+(.+?)\}\}/g,function(_,emoji,content){
    const color=emoji==='🎯'?s.ac:(emoji==='🪞'?'#1E3A5F':'#C9A227');
    return '<span style="display:inline-block;border:1px dashed '+color+';background:'+s.al+';padding:2px 8px;border-radius:4px;color:'+color+';font-size:14px;font-weight:600">'+emoji+' '+content+'</span>';
  });
  return h;
}

// 金箔首字下沉
function renderDropcap(letter,c,s){

// ═══════════════════════════════════════════════
// SVG 占位图生成 - 关键技术：用 SVG data URI 作为 <img> 的 src
// 公众号编辑器会识别 <img> 并允许用户点击替换，替换时外层样式保留
// ═══════════════════════════════════════════════
function svgPlaceholder(label, num, accent, bgColor, isQuote, isCover){
  const w = 800;
  const h = isCover ? 450 : 600;
  const ac = accent.replace("#","");
  const bg = (bgColor || "#f5f5f5").replace("#","");

  // 关键：SVG 内部统一用单引号，避免与外层 HTML 的 src="..." 冲突
  let labelMark = "";
  if(isQuote){
    labelMark = "<rect x='40' y='40' width='130' height='44' rx='4' fill='#"+ac+"'/><text x='105' y='71' font-family='-apple-system,sans-serif' font-size='22' font-weight='700' fill='white' text-anchor='middle'>QUOTE</text>";
  }else if(isCover){
    labelMark = "<rect x='40' y='40' width='150' height='44' rx='4' fill='#"+ac+"'/><text x='115' y='71' font-family='-apple-system,sans-serif' font-size='22' font-weight='700' fill='white' text-anchor='middle'>COVER</text>";
  }

  const cx = w/2;
  const cy = h/2;

  // 相机图标 + 文字提示
  const svg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 "+w+" "+h+"'>"
    + "<rect width='"+w+"' height='"+h+"' fill='#"+bg+"'/>"
    + labelMark
    // 相机图标外框
    + "<rect x='"+(cx-70)+"' y='"+(cy-90)+"' width='140' height='100' rx='8' fill='none' stroke='#"+ac+"' stroke-width='4'/>"
    // 相机镜头
    + "<circle cx='"+cx+"' cy='"+(cy-40)+"' r='28' fill='none' stroke='#"+ac+"' stroke-width='4'/>"
    + "<circle cx='"+cx+"' cy='"+(cy-40)+"' r='12' fill='#"+ac+"' fill-opacity='0.3'/>"
    // 相机顶部小凸起
    + "<rect x='"+(cx-20)+"' y='"+(cy-100)+"' width='40' height='14' rx='3' fill='#"+ac+"'/>"
    // 主标题：角色 + 编号
    + "<text x='"+cx+"' y='"+(cy+60)+"' font-family='-apple-system,PingFang SC,sans-serif' font-size='38' font-weight='700' fill='#"+ac+"' text-anchor='middle'>"+label+" "+num+"</text>"
    // 副标题：操作提示
    + "<text x='"+cx+"' y='"+(cy+105)+"' font-family='-apple-system,PingFang SC,sans-serif' font-size='22' fill='#"+ac+"' fill-opacity='0.65' text-anchor='middle'>点击此处替换为图片</text>"
    + "</svg>";

  // URL 编码：把 # 等特殊字符全部转义，保证 data URI 在 HTML src 里安全
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

// 配图（默认） - 带风格化边框 + 图注
function renderFig(s, k, img, num, mode){
  const cfg = IMG[k] || IMG.ruins;
  const frame = cfg.frame(s);
  let imgSrc;
  if(mode==="preview" && img && img.dataUrl){
    imgSrc = img.dataUrl;
  }else{
    imgSrc = svgPlaceholder("配图", num, s.ac, s.al, false, false);
  }
  let html = '<section style="margin:24px 0">';
  html += '<section style="' + frame + '"><img src="' + imgSrc + '" style="display:block;width:100%;height:auto" /></section>';
  const cap = img && img.caption ? img.caption : "";
  if(cap){
    let prefix = cfg.capPrefix || "";
    let suffix = cfg.capSuffix || "";
    if(cfg.capNum){
      const n = cfg.capNumFmt!==undefined ? cfg.capNumFmt + (num<10?'0'+num:num) + '  ' : (num<10?'0'+num:num) + '.  ';
      prefix = n + prefix;
    }
    html += '<p style="' + cfg.cap(s) + '">' + prefix + cap + suffix + '</p>';
  }
  html += '</section>';
  return html;
}

// 多图组合（双图/三图）
function renderMultiImg(s, k, imgs, startNum, cap, count, mode){
  const cfg = IMG[k] || IMG.ruins;
  const frame = cfg.frame(s);
  const gap = cfg.gap || "8px";
  const gapColor = cfg.gapColor || "transparent";

  let html = '<section style="margin:24px 0">';
  html += '<section style="display:flex;gap:' + gap + ';background:' + gapColor + '">';

  for(let i=0; i<count; i++){
    const img = imgs[i];
    const num = startNum + i;
    let imgSrc;
    if(mode==="preview" && img && img.dataUrl){
      imgSrc = img.dataUrl;
    }else{
      imgSrc = svgPlaceholder("图", num, s.ac, s.al, false, false);
    }
    html += '<section style="flex:1;' + frame + '"><img src="' + imgSrc + '" style="display:block;width:100%;height:auto" /></section>';
  }

  html += '</section>';
  if(cap){
    html += '<p style="' + cfg.cap(s) + '">' + cap + '</p>';
  }
  html += '</section>';
  return html;
}

// 主渲染函数
// mode: "preview" 中控台预览（显示真实图）  "export" 复制时（占位卡槽）
// ═══════════════════════════════════════════════
function render(tokens,s,k,mode){
  const bp='color:'+s.text+';font-size:15px;line-height:2;letter-spacing:1px;margin:0 0 20px';
  const html=tokens.map(function(tok){
    switch(tok.t){
      case "h1":return '<h1 style="font-size:22px;font-weight:700;color:'+s.hd+';text-align:center;margin:0 0 6px;line-height:1.6;letter-spacing:2px">'+inl(tok.c,s)+'</h1>';
      case "h2":return (H2[k]||H2.ruins)(tok.c,s);
      case "h3":return k==="collage"
        ?'<section style="margin:28px 0 14px"><h3 style="font-size:15px;font-weight:700;color:'+s.ac+';margin:0;line-height:1.6;letter-spacing:1px">◆ '+inl(tok.c,s)+'</h3></section>'
        :'<section style="margin:28px 0 14px"><h3 style="font-size:15px;font-weight:700;color:'+s.ac+';margin:0;line-height:1.6;letter-spacing:1px">'+inl(tok.c,s)+'</h3></section>';
      case "p":return '<p style="'+bp+'">'+inl(tok.c,s)+'</p>';
      case "bq":return (BQ[k]||BQ.ruins)(tok.c,s);
      case "ul":return renderUL(tok.items,s,k);
      case "ol":return renderOL(tok.items,s);
      case "code":return renderCode(tok.c,s,k);
      case "hr":return (HR[k]||HR.ruins)(s);
      case "shadow":return renderShadow(s);
      case "ring":return renderRing(tok.c,s,k);
      case "dots":return renderDots(s);
      case "elite":return renderElite(tok.c,s,k);
      case "arrows":return renderArrows(tok.items,s);
      case "eyebrow":return renderEyebrow(tok.label,tok.title,s);
      case "underline":return renderUnderline(tok.c,s);
      case "dropcap":return renderDropcap(tok.letter,tok.c,s);
      case "sign2":return renderSign2(s);
      case "lead":return renderLead(tok.c,s,k);
      case "callout":return renderCallout(tok.ctype,tok.title,tok.c,s,k);
      case "pull":return renderPull(tok.c,s,k);
      case "table":return renderTable(tok.headers,tok.rows,s,k);
      case "sign":return renderSign(tok.c,s,k);
      case "dialog":return renderDialog(tok.role,tok.name,tok.c,s,k);
      case "quest":return renderQuestCard(tok.c,s,k);
      case "hp":return renderHP(tok.current,tok.max,s,k);
      case "buff":return '<p style="'+bp+'">'+renderBuff(tok.c,s,k)+'</p>';
      case "debuff":return '<p style="'+bp+'">'+renderDebuff(tok.c,s,k)+'</p>';

      case "img":{
        const ids=tok.ids;
        const role=tok.role;
        if(role==="cover"){
          const img=images.find(im=>im.id===ids[0]);
          return renderCoverImg(s,k,img,ids[0],mode);
        }
        if(role==="quote"){
          const img=images.find(im=>im.id===ids[0]);
          return renderQuoteImg(s,k,img,ids[0],mode);
        }
        if(role==="duo"||role==="trio"){
          const imgs=ids.map(id=>images.find(im=>im.id===id));
          const cap=imgs[0]&&imgs[0].caption?imgs[0].caption:"";
          const count=role==="duo"?2:3;
          return renderMultiImg(s,k,imgs,ids[0],cap,count,mode);
        }
        // 默认 fig
        const img=images.find(im=>im.id===ids[0]);
        return renderFig(s,k,img,ids[0],mode);
      }

      case "imgUrl":{
        // 标准 markdown 图片，模拟成 fig 角色
        const fakeImg={dataUrl:tok.url,caption:tok.cap};
        return renderFig(s,k,fakeImg,"?",mode);
      }

      default:return "";
    }
  }).join("\n");
  return html + renderPawSignature(s);
}

function applyBrand(st,color){
  if(!color||!/^#[0-9a-fA-F]{6}$/.test(color))return st;
  const r=parseInt(color.slice(1,3),16),g=parseInt(color.slice(3,5),16),b=parseInt(color.slice(5,7),16);
  const l='rgb('+Math.round(r*.08+255*.92)+','+Math.round(g*.08+255*.92)+','+Math.round(b*.08+255*.92)+')';
  return Object.assign({},st,{dot:color,ac:color,al:l});
}

function runContentAudit(analysis){
  // 如果没有传入分析结果，自行生成（兼容旧调用）
  const text=document.getElementById("editor").value;
  const report=analysis||analyzeContent(text);
  const issues=[];
  const suggestions=[];

  // 基础统计
  const totalChars=report.stats.totalChars;
  const imgCount=report.images.total;
  const h2Count=report.sections.filter(s=>s.level===2).length;

  // 规则1：全文过短
  if(totalChars<200){
    issues.push({level:"warning",msg:"文章仅 "+totalChars+" 字，建议至少 200 字以上"});
  }

  // 规则2：图片数量不足
  const minImg=Math.max(1,Math.floor(h2Count*0.5));
  if(imgCount<minImg){
    suggestions.push({level:"suggestion",msg:"图片偏少（"+imgCount+" 张），建议每个主要章节至少配 1 张图"});
  }

  // 规则3：长段落无图（基于原始 tokens 检查）
  const tokens=parseMD(text);
  let charSinceImg=0;
  let lastWasImg=true;
  tokens.forEach(function(tok){
    if(tok.t==="img"||tok.t==="imgUrl"){charSinceImg=0;lastWasImg=true;}
    else if(tok.t==="p"){
      charSinceImg+=tok.c.length;
      if(charSinceImg>300&&!lastWasImg){
        suggestions.push({level:"suggestion",msg:"连续 "+charSinceImg+" 字无图片，建议在适当位置插入配图"});
        charSinceImg=0;
      }
      lastWasImg=false;
    }
  });

  // 规则4：H2后缺图
  for(let i=0;i<tokens.length;i++){
    if(tokens[i].t==="h2"){
      let hasImg=false;
      for(let j=i+1;j<Math.min(tokens.length,i+4);j++){
        if(tokens[j].t==="img"||tokens[j].t==="imgUrl"){hasImg=true;break;}
      }
      if(!hasImg){
        suggestions.push({level:"suggestion",msg:"「"+tokens[i].c+"」后缺少配图"});
      }
    }
  }

  // 规则5：导语后缺图
  let leadIndex=tokens.findIndex(t=>t.t==="lead");
  if(leadIndex>=0){
    let hasImg=false;
    for(let j=leadIndex+1;j<Math.min(tokens.length,leadIndex+4);j++){
      if(tokens[j].t==="img"||tokens[j].t==="imgUrl"){hasImg=true;break;}
    }
    if(!hasImg){
      suggestions.push({level:"suggestion",msg:"导语后缺少配图，建议插入封面图或场景图"});
    }
  }

  // 合并 analyzeContent 的智能建议
  report.suggestions.forEach(function(sug){
    suggestions.push({level:"suggestion",msg:sug.msg});
  });

  // 生成提示词
  const styleDesc=STYLE_DESCRIPTIONS[curKey]||STYLE_DESCRIPTIONS.ruins;
  const allIssues=issues.concat(suggestions);

  // 渲染审视面板
  const listEl=document.getElementById("audit-list");
  const statusEl=document.getElementById("audit-status");

  // 构建元素统计摘要
  let statsHtml="";
  if(report.elements.length>0||report.features.hasDialog||report.features.hasPullQuote){
    statsHtml+='<p style="margin:0 0 8px;color:#555;font-weight:700;font-size:10px;letter-spacing:1px">排版元素概览</p>';
    // 按分类分组显示
    const cats={};
    report.elements.forEach(function(el){
      if(!cats[el.category])cats[el.category]=[];
      cats[el.category].push(el.name+" ×"+el.count);
    });
    if(report.features.hasDialog){if(!cats["幽默叙事"])cats["幽默叙事"]=[];cats["幽默叙事"].push("角色对话 ×"+report.features.dialogCount);}
    if(report.features.hasInnerOS){if(!cats["幽默叙事"])cats["幽默叙事"]=[];cats["幽默叙事"].push("内心OS ×"+report.features.innerOSCount);}
    if(report.features.hasGag){if(!cats["幽默叙事"])cats["幽默叙事"]=[];cats["幽默叙事"].push("包袱标记 ×"+report.features.gagCount);}
    if(report.features.hasPullQuote){if(!cats["引用强调"])cats["引用强调"]=[];cats["引用强调"].push("金句 ‖…‖ ×"+report.features.pullQuoteCount);}
    if(report.features.hasLead){if(!cats["引用强调"])cats["引用强调"]=[];cats["引用强调"].push("导语 >>>");}
    if(report.features.hasCallout){if(!cats["引用强调"])cats["引用强调"]=[];cats["引用强调"].push("提示框 !!! ×"+report.features.calloutCount);}
    if(report.features.hasHP){if(!cats["游戏化"])cats["游戏化"]=[];cats["游戏化"].push("血条 [hp]");}
    if(report.features.hasBuff){if(!cats["游戏化"])cats["游戏化"]=[];cats["游戏化"].push("Buff");}
    if(report.features.hasDebuff){if(!cats["游戏化"])cats["游戏化"]=[];cats["游戏化"].push("Debuff");}

    Object.keys(cats).forEach(function(cat){
      statsHtml+='<p style="margin:0 0 2px;color:#666;font-size:10px"><span style="color:#444;font-weight:600">'+cat+'</span>：'+cats[cat].join("，")+'</p>';
    });
    statsHtml+='<section style="border-top:1px solid #222;margin:10px 0"></section>';
  }

  if(allIssues.length===0){
    listEl.innerHTML=statsHtml+'<p style="color:#4a7c59;margin:0">✓ 内容审视通过，暂无问题</p>';
    statusEl.textContent="通过";
    statusEl.style.color="#4a7c59";
  }else{
    let html=statsHtml;
    html+=allIssues.map(function(item){
      const color=item.level==="warning"?"#C45C26":"#C9A227";
      const icon=item.level==="warning"?"⚠":"◆";
      return '<p style="margin:0 0 4px;color:'+color+'">'+icon+' '+item.msg+'</p>';
    }).join("");
    // 如果有缺图建议，附加提示词
    const hasImgSuggestion=allIssues.some(i=>i.msg.includes("图"));
    if(hasImgSuggestion){
      html+='<p style="margin:8px 0 4px;color:#7A7A7A;font-weight:700">AI 插图提示词建议：</p>';
      const types=imgCount===0?["cover","character"]:["scene","character"];
      types.forEach(function(type){
        html+='<p style="margin:0 0 6px;color:#555;background:#161616;padding:6px 8px;border-radius:4px;cursor:pointer" onclick="insertAtCursor(this.textContent+String.fromCharCode(10,10))" title="点击插入到编辑器">'+PROMPT_TEMPLATES[type](styleDesc)+'</p>';
      });
    }
    listEl.innerHTML=html;
    const wCount=issues.filter(i=>i.level==="warning").length;
    statusEl.textContent=(wCount>0?wCount+" 警告 · ":"")+suggestions.length+" 建议";
    statusEl.style.color=wCount>0?"#C45C26":"#C9A227";
  }
}

// 插入元素到光标位置
// 智能选择图片 ID — 优先用图片台里的，没有则用占位数字
function smartImgIds(count){
  if(images.length>=count){
    return images.slice(0,count).map(im=>im.id).join(",");
  }
  // 不足时，已有的 + 占位
  const ids=images.map(im=>im.id);
  let next=imgIdCounter;
  while(ids.length<count){ids.push(next++);}
  return ids.join(",");
}

// 图片快捷插入 — 动态生成
function getImgSnippet(role){
  if(role==="fig"){const id=images[0]?images[0].id:1;return "![["+id+"]]\n\n";}
  if(role==="cover"){const id=images[0]?images[0].id:1;return "![["+id+"|cover]]\n\n";}
  if(role==="quote"){const id=images[0]?images[0].id:1;return "![["+id+"|quote]]\n\n";}
  if(role==="duo"){return "![["+smartImgIds(2)+"]]\n\n";}
  if(role==="trio"){return "![["+smartImgIds(3)+"]]\n\n";}
  return "";
}

function insertAtCursor(text){
  const ed=document.getElementById("editor");
  const start=ed.selectionStart;
  const end=ed.selectionEnd;
  ed.value=ed.value.slice(0,start)+text+ed.value.slice(end);
  ed.selectionStart=ed.selectionEnd=start+text.length;
  ed.focus();
  refresh();
}

// 降级方案：用临时元素 + execCommand
function fallbackCopy(htmlContent){
  const tmp=document.createElement("div");
  tmp.contentEditable="true";
  tmp.innerHTML=htmlContent;
  // 必须可见才能被选中，但放到屏幕外
  tmp.style.position="fixed";
  tmp.style.left="-9999px";
  tmp.style.top="0";
  tmp.style.opacity="0";
  document.body.appendChild(tmp);

  try{
    const range=document.createRange();
    range.selectNodeContents(tmp);
    const sel=window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    const ok=document.execCommand("copy");
    sel.removeAllRanges();
    document.body.removeChild(tmp);
    return ok;
  }catch(err){
    document.body.removeChild(tmp);
    console.error("Fallback copy failed:",err);
    return false;
  }
}

document.getElementById("copy-btn").addEventListener("click",function(){
  const s=getCur();
  const text=document.getElementById("editor").value;
  // 复制流程同样经过内容分析层（分析结果可用于后续扩展，如导出元数据）
  const _analysis=analyzeContent(text);
  const tokens=parseMD(text);
  const renderedHtml=render(tokens,s,curKey,"export");
  const full='<section style="max-width:578px;margin:0 auto;padding:24px 16px">'+renderedHtml+'</section>';

  // 优先使用现代 Clipboard API（带 .catch 处理 Promise 错误）
  if(navigator.clipboard && navigator.clipboard.write && window.ClipboardItem){
    try{
      const blob=new Blob([full],{type:"text/html"});
      const item=new ClipboardItem({"text/html":blob});
      navigator.clipboard.write([item]).then(function(){
        showCopySuccess();
      }).catch(function(err){
        console.warn("Clipboard API failed, trying fallback:",err);
        // Promise 失败 → 走降级
        if(fallbackCopy(full)){
          showCopySuccess();
        }else{
          showCopyFail("复制失败，请检查浏览器权限");
        }
      });
    }catch(err){
      console.warn("ClipboardItem creation failed, trying fallback:",err);
      if(fallbackCopy(full)){
        showCopySuccess();
      }else{
        showCopyFail("复制失败");
      }
    }
  }else{
    // 浏览器不支持 Clipboard API → 直接降级
    if(fallbackCopy(full)){
      showCopySuccess();
    }else{
      showCopyFail("浏览器不支持复制，请手动选择");
    }
  }
});
